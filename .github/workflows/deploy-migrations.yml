# Applies the Supabase migrations when they change on main.
#
# The sibling of deploy-functions.yml, and it exists for the same reason: until
# now nothing in the repo applied supabase/migrations, so a merged migration was
# only a file. The admin complimentary pass shipped that way - the frontend went
# live reading an entitlement the database had never been taught, and the edge
# function answered PASS_REQUIRED to the one account that was supposed to be
# covered.
#
# SETUP - two secrets:
#   SUPABASE_ACCESS_TOKEN  a personal access token from
#                          https://supabase.com/dashboard/account/tokens
#                          (already set for deploy-functions.yml)
#   SUPABASE_DB_PASSWORD   the project's database password, from
#                          Dashboard -> Project Settings -> Database
# The project ref comes from `project_id` in supabase/config.toml; set the
# optional SUPABASE_PROJECT_REF secret to override it. Without either secret the
# job says what is missing and exits green rather than failing every push.
name: Apply migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  # Also runs on PRs that touch migrations, where it only lists what would be
  # applied - a migration's blast radius is worth seeing before the merge, not
  # after.
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  # Apply on demand - after adding the secrets, or to resync a project that was
  # changed outside the repo. dry_run lists without applying.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List pending migrations without applying them'
        type: boolean
        default: false
      repair:
        description: 'Reconcile the remote migration history with this repo before applying (see the Repair step)'
        type: boolean
        default: false

# Never two at once, and never cancel one midway: a half-applied batch leaves
# the database in a state no commit describes.
concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are configured
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=()
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migrations skipped::Missing ${missing[*]}. Add them under Settings → Secrets and variables → Actions to apply migrations on merge."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the project ref
        if: steps.guard.outputs.configured == 'true'
        id: project
        env:
          OVERRIDE: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            ref="$OVERRIDE"
            echo "Using SUPABASE_PROJECT_REF override."
          else
            # project_id = "abcdefghijklmnopqrst" - first match wins
            ref=$(sed -n 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' supabase/config.toml | head -1)
            echo "Using project_id from supabase/config.toml."
          fi
          if [ -z "$ref" ]; then
            echo "::error title=No project ref::supabase/config.toml has no project_id and SUPABASE_PROJECT_REF is not set."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.configured == 'true'
        with:
          version: latest

      - name: Link the project
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ steps.project.outputs.ref }}"

      # What the remote has versus what the repo carries. Printed before
      # anything is applied and again into the summary, because this project has
      # been migrated by hand and through Lovable as well as from here: the
      # first runs are the moment to notice a migration the remote never
      # recorded.
      - name: List migrations
        id: list
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -uo pipefail
          supabase migration list --linked | tee migration-list.txt
          {
            echo "### Migrations -> \`${{ steps.project.outputs.ref }}\`"
            echo
            echo '```'
            cat migration-list.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A one-off reconciliation, run by hand and never on a push.
      #
      # This project was migrated through Lovable and by hand long before it was
      # migrated from here, and the two histories never matched: the remote
      # recorded ~120 versions whose timestamps sit seconds away from the
      # filenames in git (the same migration, stamped when Lovable ran it rather
      # than when the file landed), so the CLI sees a remote history full of
      # versions it cannot find locally and refuses to push anything at all.
      #
      # Repair rewrites only the migration history table - it runs no DDL and
      # changes no schema. Stale remote-only versions are marked reverted, and
      # every local version is marked applied.
      #
      # Marking local versions applied asserts their SQL is already in the
      # database. That holds here because every one of them was applied when it
      # was written (through Lovable, or by hand in the SQL editor). It is the
      # assumption to re-check if this is ever run again: a migration marked
      # applied is one push will never run.
      - name: Repair the migration history
        if: >-
          steps.guard.outputs.configured == 'true'
          && github.event_name == 'workflow_dispatch'
          && inputs.repair == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          # `migration list` prints "  LOCAL | REMOTE | TIME", pipe-separated,
          # with a blank cell where one side has nothing.
          parse() {
            sed -e 's/`//g' migration-list.txt \
              | awk -F'|' '/^[[:space:]]*[0-9 ]*\|/ {
                  gsub(/[[:space:]]/, "", $1); gsub(/[[:space:]]/, "", $2);
                  print $1 "\t" $2
                }'
          }

          local_versions=$(parse | cut -f1 | grep -E '^[0-9]+$' | sort -u || true)
          remote_versions=$(parse | cut -f2 | grep -E '^[0-9]+$' | sort -u || true)
          stale=$(comm -13 <(echo "$local_versions") <(echo "$remote_versions") || true)
          unrecorded=$(comm -23 <(echo "$local_versions") <(echo "$remote_versions") || true)

          echo "Local versions:      $(wc -w <<<"$local_versions")"
          echo "Remote-only (stale): $(wc -w <<<"$stale")"
          echo "Local unrecorded:    $(wc -w <<<"$unrecorded")"

          # In batches: the whole history is ~120 versions either way, and one
          # command per version would be 240 round trips.
          if [ -n "${stale//[[:space:]]/}" ]; then
            echo "::group::Marking stale remote versions reverted"
            xargs -n 50 supabase migration repair --linked --yes --status reverted <<<"$stale"
            echo "::endgroup::"
          fi
          if [ -n "${unrecorded//[[:space:]]/}" ]; then
            echo "::group::Marking local versions applied"
            xargs -n 50 supabase migration repair --linked --yes --status applied <<<"$unrecorded"
            echo "::endgroup::"
          fi

          {
            echo
            echo "#### Repair"
            echo
            echo "Marked **$(wc -w <<<"$stale")** remote-only versions reverted and **$(wc -w <<<"$unrecorded")** local versions applied. Schema untouched."
          } >> "$GITHUB_STEP_SUMMARY"

      # PRs and dry runs stop at the listing above: the diff is reviewable, the
      # schema change is not reversible.
      - name: Apply
        if: >-
          steps.guard.outputs.configured == 'true'
          && github.event_name != 'pull_request'
          && inputs.dry_run != true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -uo pipefail
          # No --include-all: only migrations newer than the remote's latest are
          # applied. An older one the remote never recorded stays skipped and
          # shows in the listing above, rather than being replayed blind onto a
          # schema that has moved on since.
          # --yes: the CLI asks before writing to production and, with no
          # terminal, applies nothing and exits 1 (#233, 2026-11-04).
          supabase db push --linked --yes
          supabase migration list --linked >> "$GITHUB_STEP_SUMMARY" || true
          echo "Applied from \`${GITHUB_SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
