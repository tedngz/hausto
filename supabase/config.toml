[functions.mirror-status]
# An admin's JWT, checked against user_roles in the function.
verify_jwt = false

[functions.property-discovery-cache]
# Anyone may read or clear properties:all, the only key it touches; writing it
# takes the service role key. Its Redis is shared with other functions.
verify_jwt = false

[functions.recrawl-external-listing]
